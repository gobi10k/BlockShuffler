<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Main blue→cyan gradient matching the RiverMix logo gradient -->
    <linearGradient id="brandGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#00C8FF"/>
      <stop offset="50%"  stop-color="#2B7FFF"/>
      <stop offset="100%" stop-color="#1E40FF"/>
    </linearGradient>
    <!-- Horizontal variant for the wing arcs -->
    <linearGradient id="brandGradH" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#1E40FF"/>
    </linearGradient>
  </defs>

  <!-- Background: pure black -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- ── Outer white circle arcs (left and right) ──────────────────────── -->
  <!-- Left arc -->
  <path d="M 260 290 A 290 290 0 0 0 260 734" fill="none" stroke="#FFFFFF"
        stroke-width="22" stroke-linecap="round" opacity="0.90"/>
  <!-- Right arc -->
  <path d="M 764 290 A 290 290 0 0 1 764 734" fill="none" stroke="#FFFFFF"
        stroke-width="22" stroke-linecap="round" opacity="0.90"/>

  <!-- ── Inner white circle arcs (tighter radius) ───────────────────────── -->
  <path d="M 308 330 A 230 230 0 0 0 308 694" fill="none" stroke="#FFFFFF"
        stroke-width="18" stroke-linecap="round" opacity="0.55"/>
  <path d="M 716 330 A 230 230 0 0 1 716 694" fill="none" stroke="#FFFFFF"
        stroke-width="18" stroke-linecap="round" opacity="0.55"/>

  <!-- ── Top wing curves — left side (gradient) ────────────────────────── -->
  <path d="M 512 210 C 460 200, 360 180, 290 230" fill="none" stroke="url(#brandGradH)"
        stroke-width="18" stroke-linecap="round"/>
  <path d="M 512 250 C 460 240, 370 220, 305 265" fill="none" stroke="url(#brandGradH)"
        stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- ── Top wing curves — right side (gradient, flipped) ──────────────── -->
  <path d="M 512 210 C 564 200, 664 180, 734 230" fill="none"
        stroke="url(#brandGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 512 250 C 564 240, 654 220, 719 265" fill="none"
        stroke="url(#brandGrad)" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- ── Central stem — flows down from top through the teardrop ───────── -->
  <path d="M 512 210 L 512 360" fill="none" stroke="url(#brandGrad)"
        stroke-width="20" stroke-linecap="round"/>

  <!-- ── Left fork of the tuning-fork body ─────────────────────────────── -->
  <path d="M 512 360 C 512 360, 440 390, 430 450 C 420 510, 460 540, 512 550"
        fill="none" stroke="url(#brandGrad)" stroke-width="20" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- ── Right fork ────────────────────────────────────────────────────── -->
  <path d="M 512 360 C 512 360, 584 390, 594 450 C 604 510, 564 540, 512 550"
        fill="none" stroke="url(#brandGrad)" stroke-width="20" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- ── Teardrop / water drop at centre ──────────────────────────────────
       Teardrop: rounded bottom, pointed top                               -->
  <ellipse cx="512" cy="560" rx="48" ry="60" fill="url(#brandGrad)"/>
  <!-- Pointed top of teardrop -->
  <path d="M 464 540 Q 512 480, 560 540" fill="url(#brandGrad)"/>

  <!-- ── Lower stem below teardrop ─────────────────────────────────────── -->
  <path d="M 512 622 L 512 760" fill="none" stroke="url(#brandGrad)"
        stroke-width="20" stroke-linecap="round"/>

  <!-- ── Small cap dash at very top (matches the logo's top detail) ────── -->
  <line x1="480" y1="192" x2="544" y2="192" stroke="#FFFFFF" stroke-width="14"
        stroke-linecap="round" opacity="0.8"/>
  <line x1="494" y1="208" x2="530" y2="208" stroke="#FFFFFF" stroke-width="10"
        stroke-linecap="round" opacity="0.5"/>
</svg>
