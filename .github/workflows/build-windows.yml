name: Build Windows

on:
  push:
    branches: [ master, final_draft, blockshuffler-ui-polish-wt6M4, UI_noLogo ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: List build artifacts
        run: |
          dir build /s
          if exist "build\BlockShuffler_artefacts\Release\Standalone" dir "build\BlockShuffler_artefacts\Release\Standalone" /s
          if exist "build\BlockShuffler_artefacts\Release\VST3" dir "build\BlockShuffler_artefacts\Release\VST3" /s

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockShuffler-VST3-Windows
          path: build/BlockShuffler_artefacts/Release/VST3/
          if-no-files-found: warn

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockShuffler-Standalone-Windows
          path: |
            build/BlockShuffler_artefacts/Release/Standalone/
            build/BlockShuffler_artefacts/Release/Standalone/*.exe
          if-no-files-found: warn
